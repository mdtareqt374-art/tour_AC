<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle glowing border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#5eead4" stroke-width="4" stroke-opacity="0.3" />

  <!-- Travel Luggage / Bag -->
  <g filter="url(#shadow)">
    <!-- Luggage Handle -->
    <rect x="206" y="96" width="100" height="52" rx="26" fill="none" stroke="#ffffff" stroke-width="24" />
    
    <!-- Luggage Body -->
    <rect x="126" y="136" width="260" height="260" rx="36" fill="#ffffff" />
    
    <!-- Luggage Texture Lines -->
    <line x1="186" y1="176" x2="186" y2="356" stroke="#ccfbf1" stroke-width="12" stroke-linecap="round" />
    <line x1="256" y1="176" x2="256" y2="356" stroke="#0d9488" stroke-width="14" stroke-linecap="round" />
    <line x1="326" y1="176" x2="326" y2="356" stroke="#ccfbf1" stroke-width="12" stroke-linecap="round" />

    <!-- Corner protectors -->
    <path d="M 126 172 A 36 36 0 0 1 162 136 L 162 172 Z" fill="#99f6e4" />
    <path d="M 386 172 A 36 36 0 0 0 350 136 L 350 172 Z" fill="#99f6e4" />
    <path d="M 126 360 A 36 36 0 0 0 162 396 L 162 360 Z" fill="#99f6e4" />
    <path d="M 386 360 A 36 36 0 0 1 350 396 L 350 360 Z" fill="#99f6e4" />

    <!-- Luggage Wheels -->
    <circle cx="176" cy="406" r="16" fill="#134e4a" />
    <circle cx="336" cy="406" r="16" fill="#134e4a" />
  </g>

  <!-- Coin / Currency & Plane Badge in bottom right -->
  <g filter="url(#shadow)">
    <circle cx="340" cy="340" r="74" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="8" />
    <!-- Taka Symbol / Currency Mark '৳' -->
    <text x="340" y="366" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="76" font-weight="bold" fill="#78350f" text-anchor="middle">৳</text>
  </g>

  <!-- Flight paper plane icon top left -->
  <path d="M 140 180 L 210 215 L 175 225 L 165 255 L 155 230 Z" fill="#0d9488" opacity="0.85" />
</svg>
